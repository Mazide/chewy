<div id="chewy-layer-study">
  <style>
    #chewy-layer-study .layer-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:center; }
    #chewy-layer-study .hero-figure { display:block; width:100%; max-height:470px; }
    #chewy-layer-study .layer-options { display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
    #chewy-layer-study .region { fill:var(--viz-series-1); fill-opacity:.12; stroke:var(--viz-series-1); stroke-width:2; vector-effect:non-scaling-stroke; }
    #chewy-layer-study .seam { fill:none; stroke:var(--viz-series-1); stroke-width:2; stroke-dasharray:5 4; vector-effect:non-scaling-stroke; }
    #chewy-layer-study [data-region][hidden] { display:none; }
    #chewy-layer-study .study-caption { margin-top:12px; }
    @media(max-width:480px) {
      #chewy-layer-study .layer-layout { grid-template-columns:1fr; gap:12px; }
      #chewy-layer-study .hero-figure { max-height:380px; }
      #chewy-layer-study .layer-options { flex-direction:row; flex-wrap:wrap; gap:8px; }
    }
  </style>

  <div class="study-caption" id="chewy-layer-detail" aria-live="polite">Две части причёски на общей опоре головы; под волосами нужна целая голова.</div>
  <div class="text-small text-muted study-caption">Разметка приблизительная. Исходный кадр сохранён; отдельные детали ещё не изготовлены.</div>
  <script>
    (() => {
      const root = document.getElementById('chewy-layer-study');
      const descriptions = {
        hair: 'Две части причёски на общей опоре головы; под волосами нужна целая голова.',
        face: 'Голова и шея — основа. Глаза и рот отдельно для моргания и выражений.',
        clothes: 'Рубашка и оба рукава — один цвет. Брюки — другой; контуры и ботинки сохраняются.',
        arms: 'В первой пробе — две цельные согнутые руки. Для махания понадобятся локти и отдельные кисти.',
        hidden: 'Дорисовать макушку, шею, плечевые стыки и корпус под кистями; швы прятать в перекрытиях.'
      };
      const apply = (key) => {
        const selected = Object.hasOwn(descriptions, key) ? key : 'hair';
        root.querySelectorAll('[data-region]').forEach(region => {
          region.toggleAttribute('hidden', region.dataset.region !== selected);
        });
        root.querySelectorAll('[data-select]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.select === selected));
        });
        root.querySelector('#chewy-layer-detail').textContent = descriptions[selected];
        return selected;
      };
      const restore = (state) => apply(state?.privateContent?.version === 1 ? state.privateContent.region : 'hair');
      restore(window.openai?.widgetState);
      root.querySelectorAll('[data-select]').forEach(button => {
        button.addEventListener('click', () => {
          const region = apply(button.dataset.select);
          window.openai?.setWidgetState?.({
            modelContent: { selectedRegion: button.textContent },
            privateContent: { version: 1, region }
          })?.catch(() => {});
        });
      });
      window.addEventListener('openai:set_globals', event => {
        if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
      });
    })();
  </script>
