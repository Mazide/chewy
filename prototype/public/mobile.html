<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Чуви">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#d5e6b5">
    <link rel="manifest" href="./mobile.webmanifest">
    <title>Чуви</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d5e6b5; }
      body { box-sizing: border-box; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      [hidden] { display: none !important; }
      .mobile-status { box-sizing: border-box; max-width: 440px; margin: 12vh auto 0; padding: 24px; font: 17px/1.5 system-ui, sans-serif; color: #284337; }
      .mobile-status h1 { font-size: 26px; line-height: 1.2; }
      .mobile-status button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 12px; background: #38594b; color: white; font: inherit; }
    </style>
  </head>
  <body>
    <main class="mobile-status" id="mobile-status" role="status">
      <h1 id="mobile-status-title">Открываем Чуви</h1>
      <p id="mobile-status-copy">Для запуска нужен браузер с JavaScript.</p>
      <button id="mobile-retry" type="button" hidden>Проверить ещё раз</button>
    </main>
    <iframe title="Прототип Чуви" id="mobile-app" hidden></iframe>
    <script>
      const status = document.getElementById('mobile-status');
      const title = document.getElementById('mobile-status-title');
      const copy = document.getElementById('mobile-status-copy');
      const retry = document.getElementById('mobile-retry');
      retry.addEventListener('click', () => location.reload());
      if (!window.isSecureContext) {
        title.textContent = 'Открой защищённую ссылку';
        copy.textContent = 'На телефоне Чуви нужен адрес, начинающийся с https://. Открой HTTPS-ссылку из запуска мобильного просмотра и включи Tailscale на телефоне. По обычному HTTP браузер не разрешает сохранять прогресс.';
      } else if (!navigator.locks || !window.crypto?.randomUUID) {
        title.textContent = 'Нужен другой браузер';
        copy.textContent = 'Этот браузер не поддерживает безопасное сохранение Чуви. Открой ту же HTTPS-ссылку в обновлённом Safari или Chrome.';
        retry.hidden = false;
      } else {
        status.hidden = true;
        const app = document.getElementById('mobile-app');
        app.src = './iframe.html?id=core-sandbox--all-screens&viewMode=story&mobile=1';
        app.hidden = false;
      }
    </script>
  </body>
</html>
