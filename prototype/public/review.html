<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chewy · Один день вместе</title>
  <style>html,body { margin:0; height:100%; background:#faf7ee; } iframe { width:100%; height:100%; border:0; display:block; } #notice { padding:24px; font:18px/1.5 system-ui; color:#304638; }</style>
</head>
<body>
  <div id="notice" role="alert" hidden>Для сохранения нужен HTTPS-адрес. Открой ссылку, которую напечатает команда npm run mobile. На этом компьютере также подходит localhost.</div>
  <script>
    if (window.isSecureContext && navigator.locks && crypto.randomUUID) {
      const frame = document.createElement('iframe');
      frame.title = 'Chewy · самостоятельное продуктовое ревью';
      frame.src = './iframe.html?id=product-review--walkthrough&viewMode=story';
      document.body.append(frame);
    } else document.getElementById('notice').hidden = false;
  </script>
</body>
</html>
